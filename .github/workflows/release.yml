name: CI & Cross-Platform Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Build UI
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Run Rust unit tests
        run: cargo test -p subprism-core -p subprism-audio -p subprism-asr -p subprism-llm

      - name: Check Tauri desktop app compilation
        run: cargo check -p subprism

  build-release:
    name: Build Release (${{ matrix.platform }})
    needs: check-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: release-windows-x64
          - platform: macos-latest
            artifact_name: release-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - name: Install UI dependencies & Tauri CLI v2
        run: |
          npm --prefix ui install
          npm install -g @tauri-apps/cli@2

      - name: Build Windows installers & portable archive
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          tauri build --bundles msi,nsis
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item target\release\bundle\msi\*.msi release-artifacts\ -ErrorAction SilentlyContinue
          Copy-Item target\release\bundle\nsis\*.exe release-artifacts\ -ErrorAction SilentlyContinue
          Compress-Archive -Path target\release\subprism.exe -DestinationPath "release-artifacts\SubPrism-${{ github.ref_name }}-windows-x64-portable.zip" -Force
          Get-ChildItem release-artifacts

      - name: Build macOS Apple Silicon app & DMG
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          tauri build --target aarch64-apple-darwin --bundles app
          mkdir -p release-artifacts dmg-staging
          cp -R target/aarch64-apple-darwin/release/bundle/macos/SubPrism.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "SubPrism" -srcfolder dmg-staging -ov -format UDZO "release-artifacts/SubPrism-${{ github.ref_name }}-macos-arm64.dmg"
          ls -lh release-artifacts

      - name: Upload built installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist-release

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "SubPrism ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: dist-release/*
          body: |
            ## SubPrism ${{ github.ref_name }}

            Cross-platform local AI real-time video subtitle translator in Rust + Tauri v2, featuring a **Liquid Glass** floating subtitle bar, zero-driver system audio loopback, and automatic `llama.cpp` (`Spark-X2.5-4B`) orchestration.

            ### Highlights
            - **Zero-driver system audio capture**: Windows WASAPI Loopback & macOS ScreenCaptureKit
            - **Soft-speech & whisper boost (AGC)**: Automatically lifts quiet drama/anime dialogue before Silero VAD v5 & SenseVoice-Small (configurable in Settings)
            - **Ultra-low-latency local translation**: Auto-managed `llama-server` running `Spark-X2.5-4B` in Non-Thinking mode with KV-cache prefix reuse
            - **Liquid Glass overlay**: Smoked Dark / Crystal Light / Minimal Floating modes, click-through lock (`Alt+Shift+L`), bilingual display, glossary, and `.srt` export

            ### Model Setup (Bring Your Own Local Models)
            Download `llama-server` (`>= b10833`), `Spark-X2.5-4B` GGUF, `sherpa-onnx` v2.0.3 shared library, `SenseVoice-Small`, and `silero_vad_v5.onnx`, then configure their paths in **Settings → 本地模型与引擎**. See [README](https://github.com/longzoe/SubPrism#readme) for direct download links.
