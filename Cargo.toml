[workspace]
resolver = "2"
members = [
    "crates/subprism-core",
    "crates/subprism-audio",
    "crates/subprism-asr",
    "crates/subprism-llm",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
uuid = { version = "1.15", features = ["v4"] }
directories = "6.0"
libloading = "0.8"
rand = "0.9"
subprism-core = { path = "crates/subprism-core" }
subprism-audio = { path = "crates/subprism-audio" }
subprism-asr = { path = "crates/subprism-asr" }
subprism-llm = { path = "crates/subprism-llm" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
